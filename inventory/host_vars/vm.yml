# Surcharges pour la VM de test : secrets en clair, jetables
vault_vnc_password: "astrotst"
station_hostname: pcastro
hotspot_ssid: ""
vault_become_password: "astro"   # = VM_PASSWORD de archinstall/generate.sh
# Réseaux de test (la VM n'a pas de Wi-Fi : les connexions sont créées, jamais activées)
vault_wifi_networks:
  - { ssid: "Test maison", psk: "motdepasse-test", priority: 20 }
  - { ssid: "Ouvert", priority: 1 }
# La VM n'a pas de GPS
gps_device: ""
# Sauvegarde de test : dépôt restic et archive d'images en dossiers locaux (pas de NAS)
vault_backup_restic_repository: /var/tmp/restic-test
vault_restic_password: "restic-test"
vault_backup_nas_host: ""
vault_backup_images_nfs: ""
backup_images_mountpoint: /var/tmp/archive-test
