all:
  children:
    stations:
      hosts:
        # Le mini PC, joint par mDNS (avahi) une fois le rôle ssh appliqué
        station:
          ansible_host: astro-station.local
        # VM de test lancée par vm/run.sh (SSH redirigé sur le port 2222 du portable)
        vm:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
