# Sauvegarde des fichiers personnels du portable (non versionnés) vers le dépôt restic du NAS.
#   make backup-secrets
# Restauration (portable perdu) : voir README, « Sauvegarder les secrets du portable ».
- name: Secrets et réglages personnels du portable
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/stations/vault.yml
  vars:
    restic_bin: restic
    repo_dir: "{{ playbook_dir }}"
    secret_files:
      - "{{ repo_dir }}/.vault-pass"
      - "{{ repo_dir }}/group_vars/stations/vault.yml"
      - "{{ repo_dir }}/group_vars/stations/hardware.yml"
      - "{{ repo_dir }}/group_vars/stations/locale.yml"
      - "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"       # clé qui ouvre la station
      - "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"
    restic_env:
      RESTIC_REPOSITORY: "{{ vault_backup_restic_repository | default('') }}"
      RESTIC_PASSWORD: "{{ vault_restic_password | default('') }}"
  tasks:
    - name: Dépôt restic défini dans le coffre
      ansible.builtin.assert:
        that:
          - restic_env.RESTIC_REPOSITORY | length > 0
          - restic_env.RESTIC_PASSWORD | length > 0
        fail_msg: "vault_backup_restic_repository et vault_restic_password manquent dans le coffre"
        quiet: true

    - name: Fichiers présents
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ secret_files }}"
      register: _secret_stat

    - name: Initialiser le dépôt s'il n'existe pas encore
      ansible.builtin.shell: "{{ restic_bin }} cat config >/dev/null 2>&1 || {{ restic_bin }} init"
      environment: "{{ restic_env }}"
      changed_when: false
      no_log: true

    # Code 3 (fichiers illisibles) = échec : une sauvegarde incomplète ne passe pas inaperçue
    - name: Sauvegarde restic (étiquette astro-secrets)
      ansible.builtin.command:
        argv: "{{ [restic_bin, 'backup', '--tag', 'astro-secrets']
                  + (_secret_stat.results | selectattr('stat.exists') | map(attribute='item') | list) }}"
      environment: "{{ restic_env }}"
      register: _secret_backup
      changed_when: true

    - name: Résultat
      ansible.builtin.debug:
        msg: "{{ _secret_backup.stdout_lines | select('search', 'snapshot|Files:|Added') | list }}"

    - name: Rappel
      ansible.builtin.debug:
        msg: >-
          Pour restaurer sans le portable, il faut l'adresse du dépôt et le mot de passe restic :
          garde-les dans ton gestionnaire de mots de passe.
