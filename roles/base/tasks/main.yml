# Pas de update_cache ici : un -Sy suivi d'un -S est une mise à jour partielle.
# Les mises à jour complètes passent par update.yml (make update).
- name: Paquets de base
  community.general.pacman:
    name: "{{ base_packages }}"
    state: present

- name: Nom de la machine
  ansible.builtin.hostname:
    name: "{{ station_hostname }}"

- name: Fuseau horaire
  community.general.timezone:
    name: "{{ station_timezone }}"

- name: Disposition du clavier en console
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: '^KEYMAP='
    line: "KEYMAP={{ station_keymap }}"
    create: true
    mode: "0644"

# Lu par X au démarrage : vaut pour la session XFCE, donc pour ce que tu tapes en VNC
- name: Disposition du clavier sous X
  ansible.builtin.copy:
    dest: /etc/X11/xorg.conf.d/00-keyboard.conf
    content: |
      # {{ ansible_managed }}
      Section "InputClass"
          Identifier "system-keyboard"
          MatchIsKeyboard "on"
          Option "XkbLayout" "{{ station_x11_layout }}"
      {% if station_x11_variant %}
          Option "XkbVariant" "{{ station_x11_variant }}"
      {% endif %}
      EndSection
    mode: "0644"

- name: Paquets épinglés (IgnorePkg)
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#?\s*IgnorePkg\s*='
    line: "{{ 'IgnorePkg = ' ~ (pacman_ignore | join(' ')) if pacman_ignore else '#IgnorePkg   =' }}"
    insertafter: '^\[options\]'

- name: Jamais de mise en veille
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target

- name: Pas de mise en veille USB (caméras, monture, focuser)
  ansible.builtin.copy:
    src: 50-usb-power.rules
    dest: /etc/udev/rules.d/50-usb-power.rules
    mode: "0644"
  notify: Recharger udev

- name: Désactiver systemd-timesyncd (remplacé par chrony)
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: false
    state: stopped
  failed_when: false

- name: Activer chrony
  ansible.builtin.systemd_service:
    name: chronyd
    enabled: true
    state: started

# Timer fourni par pacman-contrib : chaque semaine, garde les 3 dernières versions de chaque paquet en cache.
# Ansible ne fait que l'activer ; le nettoyage tourne sur la station, portable éteint.
- name: Nettoyage hebdomadaire du cache pacman
  ansible.builtin.systemd_service:
    name: paccache.timer
    enabled: true
    state: started

- name: Chercher les .pacnew en attente
  ansible.builtin.find:
    paths: /etc
    patterns: "*.pacnew,*.pacsave"
    recurse: true
  register: _pacnew

- name: Signaler les .pacnew (à fusionner avec pacdiff)
  ansible.builtin.debug:
    msg: "À fusionner avec 'sudo pacdiff' : {{ _pacnew.files | map(attribute='path') | list }}"
  when: _pacnew.matched > 0
