# Pas de update_cache ici : un -Sy suivi d'un -S est une mise à jour partielle.
# Les mises à jour complètes passent par update.yml (make update).
- name: Paquets de base
  community.general.pacman:
    name: "{{ base_packages }}"
    state: present

- name: Nom de la machine
  ansible.builtin.hostname:
    name: "{{ station_hostname }}"

- name: Fuseau horaire
  community.general.timezone:
    name: "{{ station_timezone }}"

- name: Disposition du clavier en console
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: '^KEYMAP='
    line: "KEYMAP={{ station_keymap }}"
    create: true
    mode: "0644"

# Lu par X au démarrage : vaut pour la session XFCE, donc pour ce que tu tapes en VNC
- name: Disposition du clavier sous X
  ansible.builtin.copy:
    dest: /etc/X11/xorg.conf.d/00-keyboard.conf
    content: |
      # Géré par Ansible (astro-station-x64) : modifier le dépôt, pas ce fichier
      Section "InputClass"
          Identifier "system-keyboard"
          MatchIsKeyboard "on"
          Option "XkbLayout" "{{ station_x11_layout }}"
      {% if station_x11_variant %}
          Option "XkbVariant" "{{ station_x11_variant }}"
      {% endif %}
      EndSection
    mode: "0644"

- name: Paquets épinglés (IgnorePkg)
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#?\s*IgnorePkg\s*='
    line: "{{ 'IgnorePkg = ' ~ (pacman_ignore | join(' ')) if pacman_ignore else '#IgnorePkg   =' }}"
    insertafter: '^\[options\]'

- name: Jamais de mise en veille
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target

- name: Pas de mise en veille USB (caméras, monture, focuser)
  ansible.builtin.copy:
    src: 50-usb-power.rules
    dest: /etc/udev/rules.d/50-usb-power.rules
    mode: "0644"
  notify: Recharger udev

# Masqué comme dans AstroArch : un « synchroniser automatiquement » (timedatectl set-ntp)
# ne peut pas le réactiver à côté de chrony
- name: Masquer systemd-timesyncd (remplacé par chrony)
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: false
    state: stopped
    masked: true

- name: Activer chrony
  ansible.builtin.systemd_service:
    name: chronyd
    enabled: true
    state: started

# Les pilotes GPS d'INDI (GPSD, GPS Simulator...) coupent NTP via timedated pour régler eux-mêmes l'heure :
# chronyd se retrouve désactivé, et la station n'a plus d'heure synchronisée.
# Inverse de configs/50-timedate.rules d'AstroArch : seul root peut toucher à NTP et à l'heure.
- name: Personne d'autre que root ne coupe NTP ni ne règle l'heure
  ansible.builtin.copy:
    dest: /etc/polkit-1/rules.d/40-astro-ntp.rules
    content: |
      // Géré par Ansible (astro-station-x64) : modifier le dépôt, pas ce fichier
      // chrony (avec le GPS via gpsd) tient l'heure ; un logiciel ne doit ni couper NTP ni régler l'horloge.
      polkit.addRule(function(action, subject) {
          if ((action.id == "org.freedesktop.timedate1.set-ntp" ||
               action.id == "org.freedesktop.timedate1.set-time") &&
              subject.user != "root") {
              return polkit.Result.NO;
          }
      });
    mode: "0644"

# Timer fourni par pacman-contrib : chaque semaine, garde les 3 dernières versions de chaque paquet en cache.
# Ansible ne fait que l'activer ; le nettoyage tourne sur la station, portable éteint.
- name: Nettoyage hebdomadaire du cache pacman
  ansible.builtin.systemd_service:
    name: paccache.timer
    enabled: true
    state: started

- name: Chercher les .pacnew en attente
  ansible.builtin.find:
    paths: /etc
    patterns: "*.pacnew,*.pacsave"
    recurse: true
  register: _pacnew

- name: Signaler les .pacnew (à fusionner avec pacdiff)
  ansible.builtin.debug:
    msg: "À fusionner avec 'sudo pacdiff' : {{ _pacnew.files | map(attribute='path') | list }}"
  when: _pacnew.matched > 0
