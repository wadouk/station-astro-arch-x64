- name: Activer NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager
    enabled: true
    state: started

- name: Wi-Fi sans économie d'énergie côté NetworkManager (configs/default-wifi-powersave-off.conf d'AstroArch)
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/default-wifi-powersave-off.conf
    content: |
      [connection]
      wifi.powersave = 2
    mode: "0644"
  notify: Recharger NetworkManager

- name: Paquet iw pour la règle udev
  community.general.pacman:
    name: iw
    state: present

- name: Wi-Fi sans économie d'énergie côté pilote (configs/81-wifi-powersave.rules d'AstroArch)
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/81-wifi-powersave.rules
    content: |
      ACTION=="add", SUBSYSTEM=="net", KERNEL=="wl*", RUN+="/usr/bin/iw dev $name set power_save off"
    mode: "0644"

# --- Réseaux Wi-Fi connus (liste wifi_networks, clés dans le coffre) ---
# Un fichier astro-wifi-<ssid>.nmconnection par réseau ; les réseaux ajoutés à la main ne sont pas touchés.
- name: Noms des fichiers de réseaux attendus
  ansible.builtin.set_fact:
    _wifi_files_expected: >-
      {{ wifi_networks | map(attribute='ssid') | map('regex_replace', '[^A-Za-z0-9_-]', '_')
         | map('regex_replace', '^', 'astro-wifi-') | map('regex_replace', '$', '.nmconnection') | list }}

- name: Réseaux Wi-Fi connus
  ansible.builtin.template:
    src: astro-wifi.nmconnection.j2
    dest: "/etc/NetworkManager/system-connections/{{ _wifi_files_expected[idx] }}"
    mode: "0600"
  loop: "{{ wifi_networks }}"
  loop_control:
    index_var: idx
    label: "{{ item.ssid }}"
  notify: Recharger les connexions NetworkManager

- name: Réseaux Wi-Fi gérés par Ansible
  ansible.builtin.find:
    paths: /etc/NetworkManager/system-connections
    patterns: "astro-wifi-*.nmconnection"
  register: _wifi_files

- name: Retirer les réseaux sortis de la liste
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _wifi_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in _wifi_files_expected
  notify: Recharger les connexions NetworkManager

# Fichier de connexion déclaratif : créé et rechargé, jamais activé de force
# (autoconnect-priority -10 : le Wi-Fi connu passe avant, le point d'accès prend le relais sur le terrain)
- name: Point d'accès Wi-Fi de terrain
  ansible.builtin.template:
    src: astro-hotspot.nmconnection.j2
    dest: /etc/NetworkManager/system-connections/astro-hotspot.nmconnection
    mode: "0600"
  when: hotspot_ssid | length > 0
  notify: Recharger les connexions NetworkManager

- name: Retirer le point d'accès s'il n'est plus configuré
  ansible.builtin.file:
    path: /etc/NetworkManager/system-connections/astro-hotspot.nmconnection
    state: absent
  when: hotspot_ssid | length == 0
  notify: Recharger les connexions NetworkManager
