- name: Logiciels astro des dépôts officiels
  community.general.pacman:
    name: "{{ astro_packages + astro_extra_packages }}"
    state: present

# --- AUR : utilisateur dédié, méthode documentée par kewlfft.aur ---
# aur_builder peut lancer pacman sans mot de passe, et rien d'autre
- name: Utilisateur aur_builder
  ansible.builtin.user:
    name: aur_builder
    system: true
    create_home: true
    home: /var/lib/aur_builder

- name: aur_builder peut lancer pacman
  ansible.builtin.copy:
    dest: /etc/sudoers.d/11-aur_builder
    content: "aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman\n"
    mode: "0440"
    validate: /usr/bin/visudo -cf %s

# paru-bin (binaire précompilé) retarde sur pacman : il a cassé au passage à libalpm.so.16.
# paru compilé depuis les sources suit toujours la libalpm installée.
- name: Retirer paru-bin
  community.general.pacman:
    name: [paru-bin, paru-bin-debug]
    state: absent

- name: Assistant AUR paru (compilé, quelques minutes la première fois)
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name: paru
    use: makepkg
    state: present

- name: Paquets AUR (PHD2...)
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name: "{{ astro_aur_packages }}"
    use: paru
    state: present
  when: astro_aur_packages | length > 0

# --- Pilotes INDI tiers : PKGBUILD généré depuis hardware.yml, compilé contre la libindi installée ---
- name: Pilotes INDI tiers
  when: indi_3rdparty_drivers | length > 0
  block:
    - name: Dossier du PKGBUILD des pilotes
      ansible.builtin.file:
        path: /var/lib/aur_builder/pkgbuilds/indi-station-drivers
        state: directory
        owner: aur_builder
        group: aur_builder
        mode: "0755"

    # Inscrite dans le PKGBUILD : une mise à jour de libindi (make update) change le PKGBUILD,
    # donc recompile les pilotes contre la nouvelle libindi
    - name: Version installée de libindi
      ansible.builtin.command: pacman -Q libindi
      register: _libindi_installed
      changed_when: false
      check_mode: false

    - name: PKGBUILD des pilotes de la station
      ansible.builtin.template:
        src: PKGBUILD.j2
        dest: /var/lib/aur_builder/pkgbuilds/indi-station-drivers/PKGBUILD
        owner: aur_builder
        group: aur_builder
        mode: "0644"
      register: _drivers_pkgbuild

    # Marqueur écrit après une compilation réussie : liste de pilotes ou version changée -> recompilation,
    # et une compilation ratée est retentée au passage suivant
    - name: Dernier PKGBUILD compilé avec succès
      ansible.builtin.slurp:
        src: /var/lib/aur_builder/pkgbuilds/indi-station-drivers/.built
      register: _drivers_built
      failed_when: false

    - name: Pilotes {{ indi_3rdparty_drivers | map(attribute='name') | join(', ') }} (compilés, quelques minutes)
      become: true
      become_user: aur_builder
      ansible.builtin.command:
        cmd: makepkg --syncdeps --install --noconfirm --cleanbuild --force
        chdir: /var/lib/aur_builder/pkgbuilds/indi-station-drivers
      when: (_drivers_built.content | default('') | b64decode | trim) != _drivers_pkgbuild.checksum

    - name: Noter la compilation réussie
      ansible.builtin.copy:
        dest: /var/lib/aur_builder/pkgbuilds/indi-station-drivers/.built
        content: "{{ _drivers_pkgbuild.checksum }}\n"
        owner: aur_builder
        group: aur_builder
        mode: "0644"

# --- Pièges connus en astro ---
# ModemManager sonde les ports série : il perturbe la monture (EQMod) et le GPS
- name: Masquer ModemManager
  ansible.builtin.file:
    src: /dev/null
    dest: /etc/systemd/system/ModemManager.service
    state: link
    force: true

# gvfs-gphoto2 monte le boîtier photo dans le gestionnaire de fichiers et le prend à INDI
- name: Pas de montage automatique des boîtiers photo
  community.general.pacman:
    name: gvfs-gphoto2
    state: absent

- name: Accès aux ports série et USB (montures, GPS, focusers)
  ansible.builtin.user:
    name: "{{ station_user }}"
    groups: uucp
    append: true
